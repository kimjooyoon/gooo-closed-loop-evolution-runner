name: Immutable closed-loop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New unused annotated tag, for example v0.1.0
        required: true
        type: string
      commit:
        description: Exact merged main SHA targeted by the new tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Verify existing annotated tag and refuse reused release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | tr -d '\n')"
          bash scripts/verify-release-boundary.sh tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Verify immutable repository setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOUNDARY_TOKEN }}
        run: bash scripts/verify-release-boundary.sh setting
      - name: Verify Go 1.27
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Initialize exact CI measurements
        run: |
          : > "$RUNNER_TEMP/gooo-ci-metrics.tsv"
      - name: Verify vet
        run: go vet ./...
      - name: Compile runner
        run: bash scripts/measure-command.sh "$RUNNER_TEMP/gooo-ci-metrics.tsv" compile go build -trimpath -o "$RUNNER_TEMP/gooo-closed-loop-evolution-runner-bin" ./cmd/gooo-closed-loop-evolution-runner
      - name: Build repository
        run: bash scripts/measure-command.sh "$RUNNER_TEMP/gooo-ci-metrics.tsv" build go build ./...
      - name: Verify tests
        run: bash scripts/measure-command.sh "$RUNNER_TEMP/gooo-ci-metrics.tsv" test go test ./...
      - name: Generate exact CI evidence
        run: |
          bash scripts/measure-command.sh "$RUNNER_TEMP/gooo-ci-metrics.tsv" conformance bash scripts/conformance.sh "$RUNNER_TEMP/gooo-closed-loop-evolution-runner-bin" "$RUNNER_TEMP/gooo-ci-metrics.tsv"
          bash scripts/finalize-evidence.sh "$RUNNER_TEMP/gooo-closed-loop-evolution-runner-evidence" "$RUNNER_TEMP/gooo-ci-metrics.tsv"
      - name: Stage immutable release assets
        id: assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-assets"
          mkdir -p "$stage"
          git archive --format=tar.gz --prefix="gooo-closed-loop-evolution-runner-$RELEASE_TAG/" "$RELEASE_COMMIT" > "$stage/gooo-closed-loop-evolution-runner-source-$RELEASE_TAG.tar.gz"
          tar -czf "$stage/gooo-closed-loop-evolution-runner-evidence-$RELEASE_TAG.tar.gz" -C "$RUNNER_TEMP/gooo-closed-loop-evolution-runner-evidence" .
          jq -n --arg schema "gooo/closed-loop-evolution-runner/release-manifest/v1" --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" '{schema:$schema,tag:$tag,commit:$commit,assets:[]}' > "$stage/release-manifest-$RELEASE_TAG.json"
          (cd "$stage" && sha256sum *.tar.gz *.json > SHA256SUMS)
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes "Immutable release for merged main $RELEASE_COMMIT."
      - name: Upload staged assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"/*
      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Verify immutable release, exact tag object, and asset digests
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOUNDARY_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-boundary.sh release "$RELEASE_TAG" "$RELEASE_COMMIT"
          response=$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          for asset in "$RUNNER_TEMP/release-assets"/*; do
            name=$(basename "$asset")
            expected="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            observed=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$response")
            test "$expected" = "$observed"
          done
